<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>404 - Page Not Found | Giulio Purgatorio</title>
  <meta name="theme-color" content="#07090e">
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07090e;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }
    .card {
      background: rgba(15, 21, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: #00f2fe;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      background: #00f2fe;
      color: #07090e;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(0, 242, 254, 0.5);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Error 404</span>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The link you followed doesn't exist or has moved.</p>
    <a href="/" class="btn-home">
      &larr; Return to Homepage
    </a>
  </div>
</body>
</html>
